<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 정책 리스트</title>

    <!-- SB Admin 2 CSS -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .hidden { display: none !important; }
        .status-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- 사이드바 -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

        <!-- 브랜드 -->
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="/admin">
            <div class="sidebar-brand-icon rotate-n-15">
                <i class="fas fa-ticket-alt"></i>
            </div>
            <div class="sidebar-brand-text mx-3">Coupon Admin</div>
        </a>

        <hr class="sidebar-divider my-0">

        <!-- 메뉴 -->
        <li class="nav-item active">
            <a class="nav-link" href="#">
                <i class="fas fa-fw fa-tachometer-alt"></i>
                <span>대시보드</span>
            </a>
        </li>

        <hr class="sidebar-divider">
        <div class="sidebar-heading">쿠폰</div>

        <li class="nav-item">
            <a class="nav-link" href="/admin">
                <i class="fas fa-fw fa-plus-circle"></i>
                <span>쿠폰 정책 생성</span>
            </a>
        </li>

        <li class="nav-item active">
            <a class="nav-link" href="/admin/policies">
                <i class="fas fa-fw fa-list"></i>
                <span>쿠폰 정책 리스트</span>
            </a>
        </li>


        <hr class="sidebar-divider d-none d-md-block">

        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>
    </ul>
    <!-- /사이드바 끝 -->

    <!-- 콘텐츠 래퍼 -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- 메인 콘텐츠 -->
        <div id="content">
            <!-- 상단바 -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <button id="sidebarToggleTop"
                        class="btn btn-link d-md-none rounded-circle mr-3">
                    <i class="fa fa-bars"></i>
                </button>

                <h1 class="h5 mb-0 text-gray-800">쿠폰 정책 리스트</h1>

                <ul class="navbar-nav ml-auto">
                    <div class="topbar-divider d-none d-sm-block"></div>
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="javascript:void(0);">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small">관리자</span>
                            <i class="fas fa-user-circle fa-lg"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <!-- /상단바 끝 -->

            <div class="container-fluid">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">등록된 쿠폰 정책</h1>
                    <a href="/admin" class="btn btn-primary btn-sm">
                        <i class="fas fa-plus mr-1"></i> 새 정책 만들기
                    </a>
                </div>

                <!-- 리스트 카드 -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-primary">쿠폰 정책 목록</h6>
                        <div class="small text-muted">
                            /policy (GET) 에서 데이터 가져옴
                        </div>
                    </div>
                    <div class="card-body">

                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead class="thead-light">
                                <tr>
                                    <th>ID</th>
                                    <th>이름</th>
                                    <th>정책타입</th>
                                    <th>할인</th>
                                    <th>대상</th>
                                    <th>유효기간</th>
                                    <th>한정수량</th>
                                    <th>발급/상태</th>
                                    <th>액션</th>
                                </tr>
                                </thead>
                                <tbody id="policyTbody">
                                <!-- JS로 채움 -->
                                </tbody>
                            </table>
                        </div>

                        <div id="emptyMsg" class="text-center text-muted mt-3 hidden">
                            등록된 정책이 없습니다.
                        </div>

                    </div>
                </div>
            </div>

        </div>
        <!-- /content 끝 -->

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>© 4VIDIA Coupon Service</span>
                </div>
            </div>
        </footer>
    </div>
    <!-- /content-wrapper 끝 -->
</div>
<!-- /wrapper 끝 -->

<!-- SB Admin 2 JS -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>

<script>
    // 데이터 로딩
    async function loadPolicies() {
        const tbody = document.getElementById('policyTbody');
        const emptyMsg = document.getElementById('emptyMsg');
        tbody.innerHTML = '';
        emptyMsg.classList.add('hidden');

        try {
            const res = await fetch('/policy');
            if (!res.ok) {
                alert('정책 목록 조회 실패: ' + res.status);
                return;
            }

            let data = await res.json();

            // 디버깅용 로그
            console.log('GET /policy 결과:', data);

            // ---- 형태 정규화 ----
            // 1) 배열이면 그대로
            if (Array.isArray(data)) {
                // ok
            }
            // 2) 페이지 형태 {content:[...]} 로 오면 content만 사용
            else if (data && Array.isArray(data.content)) {
                data = data.content;
            }
            // 3) 그 밖의 형태면 값들만 배열로
            else if (data && typeof data === 'object') {
                data = Object.values(data);
            } else {
                data = [];
            }
            // ----------------------

            if (!data || data.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');

                // 유효기간 문자열
                let validityText = '';
                if (p.validityType === 'RELATIVE') {
                    // 엔티티 필드명이 valid_days 라서 그대로 씀
                    validityText = `발급 기준 ${p.valid_days}일`;
                } else {
                    validityText = `${p.startAt || '-'} ~ ${p.endAt || '-'}`;
                }

                // 할인 문자열
                let discountText = '';
                if (p.discountType === 'PRICE') {
                    discountText = p.discountValue + '원';
                } else {
                    discountText = p.discountValue + '%';
                    if (p.maxDiscountAmount && p.maxDiscountAmount > 0) {
                        discountText += ` (최대 ${p.maxDiscountAmount}원)`;
                    }
                }

                // 대상 문자열
                let targetText = p.discountTargetType;
                if (p.discountTargetType === 'CATEGORY' && p.categoryId) {
                    targetText += ` (#${p.categoryId})`;
                } else if (p.discountTargetType === 'BOOK' && p.bookId) {
                    targetText += ` (#${p.bookId})`;
                }

                const statusBadge = p.isActivation
                    ? '<span class="status-badge bg-success text-white">활성</span>'
                    : '<span class="status-badge bg-secondary text-white">비활성</span>';

                tr.innerHTML = `
                    <td>${p.policyId}</td>
                    <td>${p.policyName}</td>
                    <td>${p.policyType}</td>
                    <td>${discountText}</td>
                    <td>${targetText}</td>
                    <td>${validityText}</td>
                    <td>${p.limitedQuantity ?? '-'}</td>
                    <td>
                        발급 ${p.issuedQuantity ?? 0}장<br/>
                        ${statusBadge}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary mb-1"
                                onclick="toggleActivation(${p.policyId}, ${p.isActivation})">
                            ${p.isActivation ? '비활성화' : '활성화'}
                        </button>
                        <button class="btn btn-sm btn-outline-danger"
                                onclick="deletePolicy(${p.policyId})">
                            삭제
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

        } catch (e) {
            console.error(e);
            alert('정책 목록 불러오는 중 오류 발생 (콘솔 확인)');
        }
    }

    // 정책 비활성/활성 토글 (간단하게 PUT 호출만)
    async function toggleActivation(id, current) {
        const confirmMsg = current
            ? '이 정책을 비활성화할까요?'
            : '이 정책을 활성화할까요?';
        if (!confirm(confirmMsg)) return;

        try {
            const res = await fetch(`/policy/${id}/activation`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isActivation: !current })
            });
            if (!res.ok) {
                alert('상태 변경 실패: ' + res.status);
                return;
            }
            await loadPolicies();
        } catch (e) {
            console.error(e);
            alert('상태 변경 중 오류 발생');
        }
    }

    // 정책 삭제
    async function deletePolicy(id) {
        if (!confirm('정책을 정말 삭제(비활성)할까요?')) return;

        try {
            const res = await fetch(`/policy/${id}`, { method: 'DELETE' });
            if (!res.ok) {
                alert('삭제 실패: ' + res.status);
                return;
            }
            await loadPolicies();
        } catch (e) {
            console.error(e);
            alert('삭제 중 오류 발생');
        }
    }

    // 초기 로딩
    document.addEventListener('DOMContentLoaded', loadPolicies);
</script>

</body>
</html>
