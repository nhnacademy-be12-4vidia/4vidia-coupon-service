<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 관리자</title>

    <!-- SB Admin 2 CSS -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- ===== 사이드바 ===== -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

        <!-- 브랜드 -->
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#">
            <div class="sidebar-brand-icon rotate-n-15">
                <i class="fas fa-ticket-alt"></i>
            </div>
            <div class="sidebar-brand-text mx-3">Coupon Admin</div>
        </a>

        <hr class="sidebar-divider my-0">

        <!-- 메뉴 -->
        <li class="nav-item active">
            <a class="nav-link" href="#">
                <i class="fas fa-fw fa-tachometer-alt"></i>
                <span>대시보드</span>
            </a>
        </li>

        <hr class="sidebar-divider">
        <div class="sidebar-heading">쿠폰</div>

        <li class="nav-item">
            <a class="nav-link" href="/admin">
                <i class="fas fa-fw fa-plus-circle"></i>
                <span>쿠폰 정책 생성</span>
            </a>
        </li>

        <li class="nav-item active">
            <a class="nav-link" href="/admin/policies">
                <i class="fas fa-fw fa-list"></i>
                <span>쿠폰 정책 리스트</span>
            </a>
        </li>


        <hr class="sidebar-divider d-none d-md-block">

        <!-- 사이드바 토글 -->
        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>

    </ul>

    <!-- ===== 콘텐츠 전체 ===== -->
    <div id="content-wrapper" class="d-flex flex-column">

        <div id="content">

            <!-- ===== 상단바 ===== -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 shadow">

                <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                    <i class="fa fa-bars"></i>
                </button>

                <h1 class="h5 mb-0 text-gray-800">쿠폰 관리자 콘솔</h1>

                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small">관리자</span>
                            <i class="fas fa-user-circle fa-lg"></i>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- ===== 페이지 내용 ===== -->
            <div class="container-fluid">

                <h1 class="h3 mb-4 text-gray-800">쿠폰 정책 & 발급</h1>

                <div class="row">

                    <!-- ================== 좌측 — 정책 생성 ================== -->
                    <div class="col-lg-8 mb-4" id="policyCard">
                        <div class="card shadow">
                            <div class="card-header">
                                <h6 class="m-0 font-weight-bold text-primary">쿠폰 정책 생성</h6>
                            </div>

                            <div class="card-body">
                                <form id="policyForm">

                                    <div class="form-group">
                                        <label>정책 이름</label>
                                        <input type="text" class="form-control" id="policyName" required>
                                    </div>

                                    <div class="form-row">
                                        <div class="form-group col-md-4">
                                            <label>정책 타입</label>
                                            <select id="policyType" class="form-control">
                                                <option value="WELCOME">WELCOME</option>
                                                <option value="BIRTHDAY">BIRTHDAY</option>
                                                <option value="EVENT">EVENT</option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-4">
                                            <label>할인 방식</label>
                                            <select id="discountType" class="form-control">
                                                <option value="PRICE">금액 할인</option>
                                                <option value="RATE">퍼센트 할인</option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-4">
                                            <label id="discountValueLabel">할인 금액(원)</label>
                                            <input type="number" id="discountValue" class="form-control" required>
                                        </div>
                                    </div>

                                    <hr>

                                    <div class="form-row">
                                        <div class="form-group col-md-4">
                                            <label>할인 적용 대상</label>
                                            <select id="discountTargetType" class="form-control">
                                                <option value="ALL">전체</option>
                                                <option value="CATEGORY">카테고리</option>
                                                <option value="BOOK">도서</option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-4 hidden" id="categoryGroup">
                                            <label>카테고리</label>
                                            <select id="categoryId" class="form-control">
                                                <option value="">선택</option>
                                                <option value="1">IT</option>
                                                <option value="2">소설</option>
                                                <option value="3">라노벨</option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-4 hidden" id="bookGroup">
                                            <label>도서 ID</label>
                                            <input type="number" id="bookId" class="form-control">
                                        </div>
                                    </div>

                                    <hr>

                                    <div class="form-row">
                                        <div class="form-group col-md-4">
                                            <label>유효기간 타입</label>
                                            <select id="validityType" class="form-control">
                                                <option value="RELATIVE">상대</option>
                                                <option value="ABSOLUTE">절대</option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-4" id="validDaysGroup">
                                            <label>유효기간(일)</label>
                                            <input type="number" id="validDays" class="form-control">
                                        </div>

                                        <div class="form-group col-md-4 hidden" id="startAtGroup">
                                            <label>시작일시</label>
                                            <input type="datetime-local" id="startAt" class="form-control">
                                        </div>

                                        <div class="form-group col-md-4 hidden" id="endAtGroup">
                                            <label>종료일시</label>
                                            <input type="datetime-local" id="endAt" class="form-control">
                                        </div>
                                    </div>

                                    <hr>

                                    <div class="form-row">
                                        <div class="form-group col-md-4">
                                            <label>한정 수량</label>
                                            <input type="number" id="limitedQuantity" class="form-control">
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label>최소 주문 금액</label>
                                            <input type="number" id="minOrderAmount" class="form-control" value="0">
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label>최대 할인 금액</label>
                                            <input type="number" id="maxDiscountAmount" class="form-control" value="0">
                                        </div>
                                    </div>

                                    <div class="form-check">
                                        <input type="checkbox" id="isActivation" class="form-check-input" checked>
                                        <label class="form-check-label">활성화</label>
                                    </div>

                                    <button class="btn btn-primary mt-3">정책 생성</button>
                                    <div id="policyResult" class="mt-2 small text-muted"></div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- ================== 우측 — 발급 테스트 ================== -->
                    <div class="col-lg-4 mb-4" id="issueCard">
                        <div class="card shadow">
                            <div class="card-header">
                                <h6 class="m-0 font-weight-bold text-success">선착순 발급 테스트</h6>
                            </div>
                            <div class="card-body">
                                <label>정책 ID</label>
                                <input type="number" id="issuePolicyId" class="form-control mb-2">

                                <label>유저 ID</label>
                                <input type="number" id="issueUserId" class="form-control mb-3">

                                <button id="issueBtn" class="btn btn-success btn-block">
                                    발급 요청 보내기
                                </button>

                                <div id="issueResult" class="mt-2 small text-muted">
                                    결과가 여기에 표시됩니다.
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- ===== 푸터 ===== -->
            <footer class="sticky-footer bg-white">
                <div class="text-center my-auto">
                    <span>© 4VIDIA Coupon Service</span>
                </div>
            </footer>

        </div>
    </div>
</div>

<!-- ===== JS ===== -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>

<script>
    // 할인타입 변경 시 라벨 변경
    document.getElementById("discountType").addEventListener("change", e => {
        document.getElementById("discountValueLabel").innerText =
            e.target.value === "RATE" ? "할인율 (%)" : "할인 금액(원)";
    });

    // 적용 대상 필드 토글
    const discountTargetType = document.getElementById("discountTargetType");
    const categoryGroup = document.getElementById("categoryGroup");
    const bookGroup = document.getElementById("bookGroup");

    function toggleTarget() {
        const v = discountTargetType.value;
        categoryGroup.classList.toggle("hidden", v !== "CATEGORY");
        bookGroup.classList.toggle("hidden", v !== "BOOK");
    }
    discountTargetType.addEventListener("change", toggleTarget);
    toggleTarget();

    // 유효기간 타입 토글
    const validityType = document.getElementById("validityType");
    const validDaysGroup = document.getElementById("validDaysGroup");
    const startAtGroup = document.getElementById("startAtGroup");
    const endAtGroup = document.getElementById("endAtGroup");

    function toggleValidity() {
        if (validityType.value === "RELATIVE") {
            validDaysGroup.classList.remove("hidden");
            startAtGroup.classList.add("hidden");
            endAtGroup.classList.add("hidden");
        } else {
            validDaysGroup.classList.add("hidden");
            startAtGroup.classList.remove("hidden");
            endAtGroup.classList.remove("hidden");
        }
    }
    validityType.addEventListener("change", toggleValidity);
    toggleValidity();

    // ===================== 정책 생성 JSON POST =====================
    function toIntOrNull(v) {
        if (v === "" || v === null) return null;
        return parseInt(v, 10);
    }

    document.getElementById("policyForm").addEventListener("submit", async e => {
        e.preventDefault();

        const payload = {
            policyName: document.getElementById("policyName").value,
            policyType: document.getElementById("policyType").value,
            discountType: document.getElementById("discountType").value,
            discountTargetType: document.getElementById("discountTargetType").value,

            discountValue: toIntOrNull(document.getElementById("discountValue").value),
            categoryId: toIntOrNull(document.getElementById("categoryId").value),
            bookId: toIntOrNull(document.getElementById("bookId").value),

            validityType: document.getElementById("validityType").value,
            valid_days: toIntOrNull(document.getElementById("validDays").value),

            startAt: document.getElementById("startAt").value || null,
            endAt: document.getElementById("endAt").value || null,

            limitedQuantity: toIntOrNull(document.getElementById("limitedQuantity").value),
            minOrderAmount: toIntOrNull(document.getElementById("minOrderAmount").value),
            maxDiscountAmount: toIntOrNull(document.getElementById("maxDiscountAmount").value),

            isActivation: document.getElementById("isActivation").checked
        };

        const result = document.getElementById("policyResult");

        try {
            const res = await fetch("/policy", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const json = await res.json();
                result.innerHTML = `<span class="text-success">정책 생성 성공! ID = ${json.policyId}</span>`;
            } else {
                const text = await res.text();
                result.innerHTML = `<span class="text-danger">실패 (${res.status})<br>${text}</span>`;
            }
        } catch (err) {
            result.innerHTML = `<span class="text-danger">오류 발생 (콘솔 확인)</span>`;
            console.error(err);
        }
    });

    // ===================== 발급 테스트 =====================
    document.getElementById("issueBtn").addEventListener("click", async () => {
        const policyId = document.getElementById("issuePolicyId").value;
        const userId = document.getElementById("issueUserId").value;
        const out = document.getElementById("issueResult");

        try {
            const res = await fetch(`/${policyId}/issue?userId=${userId}`, { method: "POST" });
            out.innerText = `HTTP ${res.status}`;
        } catch (err) {
            out.innerText = "오류 발생";
        }
    });
</script>

</body>
</html>
